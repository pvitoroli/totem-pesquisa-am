<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso - Pesquisa de Sentimento</title>
    
    <link rel="stylesheet" href="style-agradecimento.css">

    <style>
        body {
            background-color: #1b1e27;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Evita rolagens indesejadas no celular */
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* ==========================================================================
           MODO CLARO (INJEÇÃO PARA O TOTEM)
           ========================================================================== */
        body.light-mode { background-color: #f5f7f9 !important; }
        body.light-mode .success-title { color: #1e222d !important; }
        body.light-mode #msg-agradecimento { color: #6b7280 !important; }
        body.light-mode .status-box { 
            background-color: #ffffff !important; 
            border-color: rgba(0,0,0,0.1) !important; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05) !important;
        }
        body.light-mode #textoStatus { color: #6b7280 !important; }
        
        /* 1. Animação de entrada suave da caixa toda (Fade In Up) */
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 2. Animação de pop do ícone */
        .success-check-icon {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.2s;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 3. Efeito Glow Laranja (Totem Fixo) */
        .glow-pulse-orange {
            box-shadow: 0 0 15px rgba(255, 81, 0, 0.3);
            animation: pulseGlowOrange 2s infinite alternate;
            background-color: rgba(255, 81, 0, 0.1);
        }

        @keyframes pulseGlowOrange {
            from { box-shadow: 0 0 15px rgba(255, 81, 0, 0.2); }
            to { box-shadow: 0 0 35px rgba(255, 81, 0, 0.6); }
        }
        
        .status-box {
            margin-top: 40px; 
            padding: 12px 20px; 
            border-radius: 12px; 
            background-color: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <script>
        const themeParams = new URLSearchParams(window.location.search);
        const isLight = themeParams.get('theme') === 'light' || localStorage.getItem('theme') === 'light';
        if(isLight) {
            document.body.classList.add('light-mode');
        }
    </script>

    <div class="totem-app-canvas animate-fade-in-up" style="width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 70vh;">
      
      <div class="success-box">
        <div class="success-icon-wrapper glow-pulse-orange" style="width: 90px; height: 90px; margin: 0 auto 24px auto; border-radius: 50%; padding: 15px; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="rgb(255, 81, 0)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="success-check-icon" style="width: 100%; height: 100%;">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        
        <h2 class="success-title" style="font-size: 26px; font-weight: 800; margin-bottom: 8px; color: white;">SENTIMENTO REGISTRADO!</h2>
        
        <h5 id="msg-agradecimento" style="color: #a0a5b0; font-family: Helvetica; font-size: 16px; font-weight: normal; margin-top: 0;">
          Sua voz molda o nosso futuro!
        </h5>
        
        <div class="status-box">
            <p id="textoStatus" style="color: rgba(255,255,255,0.5); font-size: 13px; margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgb(255, 81, 0)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Retornando à tela inicial...
            </p>
        </div>
      </div>

    </div>

    <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwuxwABRXCV3juwoRT1KXZ58gYVSxTueqMuu3Dn1Q9JA2ypyWQv0klh3yCpA3UakU7q/exec";

    // Bloqueio do botão voltar
    window.history.replaceState(null, null, window.location.href);
    window.onpopstate = function () {
        window.history.go(1);
    };

    // 1. Captura os dados que chegaram em frações de segundo
    const urlParams = new URLSearchParams(window.location.search);
    const idCampanha = urlParams.get('id') || "";
    const setorCampanha = urlParams.get('setor') || "Geral";
    const evento = urlParams.get('evento');
    const sentimento = urlParams.get('sentimento');
    const nota = urlParams.get('nota');
    const proposta = urlParams.get('proposta') || "Geral";
    const modeString = isLight ? "&theme=light" : ""; // String auxiliar de tema

    // Tenta puxar a frase do painel
    const fraseCache = localStorage.getItem('agradecimento_' + idCampanha);
    if(fraseCache) {
        document.getElementById('msg-agradecimento').innerText = fraseCache;
    }

    // 2. FUNÇÃO MESTRA DE ENVIO SEGURO
    async function processarVotoERetornar() {
        
        // Relógio de Segurança: Garante que o utilizador vai ter PELO MENOS 3 segundos para ler a frase
        const tempoMinimoLeitura = new Promise(resolve => setTimeout(resolve, 3000));
        
        let requisicaoAoGoogle = Promise.resolve();

        // Se trouxer os dados da tela anterior, faz o envio em "background"
        if (evento && sentimento && nota) {
            const payload = {
                "evento": evento,
                "sentimento": sentimento,
                "nota": parseInt(nota),
                "setor": setorCampanha,
                "origem": "Totem Fixo",
                "proposta": proposta
            };
            
            requisicaoAoGoogle = fetch(URL_BACKEND, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            }).catch(e => console.error(e));
        }

        // 🔥 A MÁGICA ACONTECE AQUI 🔥
        // O sistema vai esperar pelos 3 segundos de leitura E esperar pelo Google responder. 
        await Promise.all([tempoMinimoLeitura, requisicaoAoGoogle]);

        // Tudo finalizado e seguro! Volta a abrir o totem inicial repassando a string do tema.
        window.location.href = `index.html?evento=${idCampanha}&setor=${encodeURIComponent(setorCampanha)}${modeString}`;
    }

    // Inicia assim que a tela abre
    window.onload = processarVotoERetornar;
</script>

</body>
</html>
