<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Sentimento - AMP (Público)</title>
    
    <link rel="stylesheet" href="style-publico.css">

    <style>
        body {
            background-color: #1b1e27;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1b1e27;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            width: 100%;
        }

        .splash-logo-img {
            filter: brightness(1.2);
            max-width: 130px;
            max-height: 35px;
            width: 100%;
            height: auto;
            object-fit: contain;
            margin-top: -40px; 
            margin-bottom: 24px; 
        }

        .loading-bar-container {
            position: relative;
            width: 220px;
            height: auto;
            margin-top: 35px;
            overflow: hidden;
        }

        .loading-bar-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .loading-mask {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: #1b1e27;
            animation: revealRight 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes revealRight {
            0% { left: 0%; }
            100% { left: 100%; }
        }

        .splash-slogan {
            font-size: 11px;
            text-transform: uppercase;
            color: #a0a5b0;
            letter-spacing: 1.2px;
            font-weight: 600;
            margin-top: 25px;
            opacity: 0;
            animation: fadeInSlogan 1.5s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes fadeInSlogan {
            to { opacity: 1; }
        }

        .splash-glow {
            position: absolute;
            width: 160px;
            height: 160px;
            background: rgba(255, 81, 0, 0.12);
            border-radius: 50%;
            filter: blur(40px);
            z-index: -1;
            animation: pulseGlow 1.5s alternate infinite ease-in-out;
        }

        @keyframes pulseGlow {
            from { transform: scale(0.9); opacity: 0.5; }
            to { transform: scale(1.1); opacity: 1; }
        }

        .vote-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .vote-card:active {
            transform: scale(0.95);
        }

        .vote-card:hover {
            box-shadow: 0 10px 25px rgba(255, 81, 0, 0.15);
            transform: translateY(-5px);
        }

        .totem-app-canvas {
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.7s ease, opacity 0.7s ease;
        }

        #cinematic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(6, 8, 12, 0.75);
            backdrop-filter: blur(0px); 
            -webkit-backdrop-filter: blur(0px);
            opacity: 0;
            visibility: hidden;
            z-index: 99990;
            transition: opacity 0.6s ease, visibility 0.6s ease, backdrop-filter 0.6s ease, -webkit-backdrop-filter 0.6s ease;
        }

        #cinematic-overlay.active {
            opacity: 1;
            visibility: visible;
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
        }

        .pulse-dot-amarelo {
            width: 6px !important;
            height: 6px !important;
            background-color: #ffb703 !important; 
            border-radius: 50% !important;
            display: inline-block !important;
            animation: pulseAmarelo 1.5s infinite !important;
        }

        @keyframes pulseAmarelo {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 183, 3, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(255, 183, 3, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 183, 3, 0); }
        }

        /* 🔥 ANIMAÇÕES E BOTÃO DO BLOQUEIO PREMIUM 🔥 */
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-fechar-bloqueio {
            background: rgba(255, 255, 255, 0.05);
            color: #a0a5b0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            margin-top: 0;
            width: 100%;
            font-family: inherit;
        }
        .btn-fechar-bloqueio:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Adaptação do botão de bloqueio para o Modo Claro */
        body.light-mode .btn-fechar-bloqueio {
            background: rgba(0, 0, 0, 0.05);
            color: #6b7280;
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.light-mode .btn-fechar-bloqueio:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #1e222d;
        }
    </style>
</head>
<body>

    <div id="cinematic-overlay"></div>

    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-glow"></div>
            <img src="logo-arcelormittal.png" class="splash-logo-img" alt="Logo ArcelorMittal" onerror="this.style.display='none'">
            <span class="campaign-mini-label" style="font-size: 11px; text-transform: uppercase; color: rgb(160, 165, 176); letter-spacing: 2px; font-weight: 700; margin-bottom: 2px;">Você está na</span>
            <h1 style="font-size: 28px; font-weight: 800; color: white; margin: 5px 0 0 0; letter-spacing: 0.5px;">PESQUISA DE<br>SENTIMENTO</h1>
            <div class="loading-bar-container">
                <img src="simbolo-app.png" alt="Carregando..." class="loading-bar-img" onerror="this.style.display='none'">
                <div class="loading-mask"></div>
            </div>
            <div class="splash-slogan">A força da voz que molda o aço</div>
        </div>
    </div>

    <div class="totem-app-canvas" id="main-interface" style="width: 100%; max-width: 600px;">
      <div class="totem-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; margin-bottom: 24px; height: 50px;">
        <div class="company-logo-area" style="display: flex; align-items: center; max-width: 140px; height: 100%;">
            <img src="logo-arcelormittal.png" alt="Logo ArcelorMittal" class="brand-logo-img" style="filter: brightness(1.2); max-width: 130px; max-height: 35px; width: 100%; height: auto; object-fit: contain;" onerror="this.style.display='none'"/>
        </div>
        <div class="header-right-text" style="display: flex;">
            <span class="brand-subtext" style="font-size: 11px; color: rgb(160, 165, 176); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600;">PESQUISA DE SENTIMENTO - AMP</span>
        </div>
      </div>
      
      <div class="title-section" style="text-align: center; margin-bottom: 28px; display: flex; flex-direction: column; align-items: center;">
        <span class="campaign-mini-label" style="font-size: 11px; text-transform: uppercase; color: rgb(160, 165, 176); letter-spacing: 2px; font-weight: 700; margin-bottom: 2px;">Campanha Ativa</span>
        
        <h3 id="nome-campanha-ativa" style="text-align: center; color: rgb(255, 81, 0); font-weight: bold; position: relative; margin-top: 5px; margin-bottom: 5px;">CARREGANDO...</h3>
        
        <h5 style="text-align: center; font-size: 15px; color: #a0a5b0; font-family: Helvetica; margin-top: 25px; margin-bottom: 15px;">
          <span id="pergunta-principal-txt" style="font-weight: normal; color: white;">O que você <b>SENTIU</b> no evento ou ação de hoje?</span>
        </h5>
        
        <div class="status-online-area" style="display: inline-flex; align-items: center; gap: 6px; background-color: rgba(255, 255, 255, 0.03); padding: 4px 10px; border-radius: 12px;">
            <span class="pulse-dot-amarelo"></span>
            <span class="status-text" style="font-size: 10px; color: rgb(160, 165, 176); font-weight: 600;">Conexão Totem Público</span>
        </div>
      </div>

      <div class="voting-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%;">
        
        <a href="javascript:void(0)" onclick="escolherSentimento(event, 1, this)" class="vote-card border-orange" style="background-color: #2a2f3a; border: 1.5px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 36px 12px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; text-decoration: none;">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s1" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f632/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s1" class="card-label" style="font-size: 13px; font-weight: 700; color: rgb(255, 255, 255); text-align: center; display: block; padding-top: 4px; text-transform: uppercase;">APRENDI<br>ALGO NOVO</span>
        </a>

        <a href="javascript:void(0)" onclick="escolherSentimento(event, 2, this)" class="vote-card border-yellow" style="background-color: #2a2f3a; border: 1.5px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 36px 12px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; text-decoration: none;">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s2" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f601/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s2" class="card-label" style="font-size: 13px; font-weight: 700; color: rgb(255, 255, 255); text-align: center; display: block; padding-top: 4px; text-transform: uppercase;">FIQUEI<br>FELIZ</span>
        </a>

        <a href="javascript:void(0)" onclick="escolherSentimento(event, 3, this)" class="vote-card border-purple" style="background-color: #2a2f3a; border: 1.5px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 36px 12px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; text-decoration: none;">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s3" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f9d0/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s3" class="card-label" style="font-size: 13px; font-weight: 700; color: rgb(255, 255, 255); text-align: center; display: block; padding-top: 4px; text-transform: uppercase;">QUERO<br>SABER MAIS</span>
        </a>

        <a href="javascript:void(0)" onclick="escolherSentimento(event, 4, this)" class="vote-card border-pink" style="background-color: #2a2f3a; border: 1.5px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 36px 12px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; text-decoration: none;">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s4" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f614/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s4" class="card-label" style="font-size: 13px; font-weight: 700; color: rgb(255, 255, 255); text-align: center; display: block; padding-top: 4px; text-transform: uppercase;">PODERIA<br>SER MELHOR</span>
        </a>
      </div>
    </div>

    <script>
        // 🚨 1. CERCA ELÉTRICA BLINDADA CONTRA O BOTÃO "VOLTAR" 🚨
        const urlParams = new URLSearchParams(window.location.search);
        const idEventoAtual = urlParams.get('evento');
        let setorAtual = urlParams.get('setor') || "Geral";
        let propostaAtual = urlParams.get('proposta') || "Geral";
        
        const chaveBloqueio = propostaAtual !== "Geral" ? 'votou_' + idEventoAtual + '_' + propostaAtual : 'votou_' + idEventoAtual;
        
        let nomeRealDaCampanha = "Carregando...";

        let sentimentosAtivos = {
            1: { texto: "Aprendi algo novo", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f632/512.gif" },
            2: { texto: "Fiquei feliz", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f601/512.gif" },
            3: { texto: "Quero saber mais", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f9d0/512.gif" },
            4: { texto: "Poderia ser melhor", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f614/512.gif" }
        };

        // 🔥 O CHECK DE BLOQUEIO PREMIUM 🔥
        function checarBloqueio() {
            if (idEventoAtual && localStorage.getItem(chaveBloqueio) === 'sim') {
                const isLight = document.body.classList.contains('light-mode');
                const bgColor = isLight ? '#ffffff' : '#2a2f3a';
                const textColor = isLight ? '#1e222d' : 'white';
                const textMuted = isLight ? '#6b7280' : '#a0a5b0';
                const borderColor = isLight ? 'rgba(0,0,0,0.1)' : 'rgba(255, 255, 255, 0.05)';
                
                const splash = document.getElementById('splash-screen');
                if (splash) splash.style.display = 'none';

                document.body.innerHTML = `
                    <div class="totem-app-canvas animate-fade-in-up" style="width: 100%; max-width: 450px; padding: 0 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100vh; margin: 0 auto; box-sizing: border-box;">
                        <div style="background-color: ${bgColor}; border: 1.5px solid ${borderColor}; border-radius: 24px; padding: 40px 20px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.4); box-sizing: border-box;">
                            <div style="width: 80px; height: 80px; margin: 0 auto 24px auto; background-color: rgba(255, 81, 0, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(255, 81, 0, 0.2);">
                                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ff5100" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                    <line x1="12" y1="9" x2="12" y2="13"></line>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </div>
                            <h2 style="color: ${textColor}; margin: 0 0 12px 0; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px;">Voto Já Registrado</h2>
                            <p style="color: ${textMuted}; line-height: 1.6; font-size: 14px; margin: 0 0 30px 0;">Identificamos que uma participação já foi contabilizada para este dispositivo.</p>
                            <button class="btn-fechar-bloqueio" onclick="window.close()" style="margin: 0;">Fechar Página</button>
                        </div>
                    </div>
                `;
                throw new Error("Acesso Bloqueado: Usuário já votou."); 
            }
        }

        checarBloqueio();
        window.addEventListener('pageshow', checarBloqueio);

        // -----------------------------------------------------------
        // 2. RESTANTE DO CÓDIGO NORMAL & CARREGAMENTO DO TEMPLATE
        // -----------------------------------------------------------
        const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwuxwABRXCV3juwoRT1KXZ58gYVSxTueqMuu3Dn1Q9JA2ypyWQv0klh3yCpA3UakU7q/exec"; 

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('hidden');
                    setTimeout(() => splash.style.display = 'none', 500); 
                }
            }, 4500); 
        });

        async function buscarEventoAtivo() { 
            if (idEventoAtual) { 
                try { 
                    const antiCache = Date.now(); 
                    const res = await fetch(`${URL_BACKEND}?acao=buscarPorId&id=${idEventoAtual}&t=${antiCache}`); 
                    const dados = await res.json(); 
                    
                    if (dados.sucesso) { 
                        nomeRealDaCampanha = dados.nome; 
                        setorAtual = dados.setor || setorAtual; 
                        
                        if (dados.template) {
                            const t = dados.template;
                            
                            if (t.pergunta) {
                                document.getElementById('pergunta-principal-txt').innerText = t.pergunta;
                            }
                            
                            if (t.s1_texto) {
                                sentimentosAtivos[1].texto = t.s1_texto;
                                document.getElementById('label-s1').innerText = t.s1_texto;
                            }
                            if (t.s1_gif) {
                                sentimentosAtivos[1].gif = t.s1_gif;
                                document.getElementById('gif-s1').src = t.s1_gif;
                            }

                            if (t.s2_texto) {
                                sentimentosAtivos[2].texto = t.s2_texto;
                                document.getElementById('label-s2').innerText = t.s2_texto;
                            }
                            if (t.s2_gif) {
                                sentimentosAtivos[2].gif = t.s2_gif;
                                document.getElementById('gif-s2').src = t.s2_gif;
                            }

                            if (t.s3_texto) {
                                sentimentosAtivos[3].texto = t.s3_texto;
                                document.getElementById('label-s3').innerText = t.s3_texto;
                            }
                            if (t.s3_gif) {
                                sentimentosAtivos[3].gif = t.s3_gif;
                                document.getElementById('gif-s3').src = t.s3_gif;
                            }

                            if (t.s4_texto) {
                                sentimentosAtivos[4].texto = t.s4_texto;
                                document.getElementById('label-s4').innerText = t.s4_texto;
                            }
                            if (t.s4_gif) {
                                sentimentosAtivos[4].gif = t.s4_gif;
                                document.getElementById('gif-s4').src = t.s4_gif;
                            }
                        }

                    } else { 
                        nomeRealDaCampanha = "Campanha Inativa"; 
                    } 
                } catch (e) { 
                    console.error("Erro ao buscar dados:", e);
                    nomeRealDaCampanha = "Ação Corporativa"; 
                } 
            } else { 
                nomeRealDaCampanha = "Pesquisa Pública"; 
            } 
            
            const elementoTitulo = document.getElementById('nome-campanha-ativa'); 
            if (elementoTitulo) elementoTitulo.innerText = nomeRealDaCampanha; 
        } 
        
        window.addEventListener('load', buscarEventoAtivo); 

        function escolherSentimento(event, numeroSentimento, elementoClicado) { 
            event.preventDefault(); 
            if (window.animacaoEmAndamento) return; 
            window.animacaoEmAndamento = true; 
            
            const objEscolhido = sentimentosAtivos[numeroSentimento] || { texto: "Geral", gif: "" };
            const sentimentoEscolhido = objEscolhido.texto;
            const gifEscolhido = objEscolhido.gif;
            
            const telaPrincipal = document.getElementById('main-interface'); 
            const overlayCinematico = document.getElementById('cinematic-overlay'); 
            
            let glowColor = 'rgba(255, 81, 0, 0.6)'; 
            if (elementoClicado.classList.contains('border-yellow')) glowColor = 'rgba(255, 204, 0, 0.6)'; 
            if (elementoClicado.classList.contains('border-purple')) glowColor = 'rgba(163, 0, 255, 0.6)'; 
            if (elementoClicado.classList.contains('border-pink')) glowColor = 'rgba(255, 0, 128, 0.6)'; 
            
            const rect = elementoClicado.getBoundingClientRect(); 
            const clone = elementoClicado.cloneNode(true); 
            elementoClicado.style.opacity = '0'; 
            
            clone.style.position = 'fixed'; 
            clone.style.top = rect.top + 'px'; 
            clone.style.left = rect.left + 'px'; 
            clone.style.width = rect.width + 'px'; 
            clone.style.height = rect.height + 'px'; 
            clone.style.margin = '0'; 
            clone.style.zIndex = '99995'; 
            clone.style.transform = 'translate(0px, 0px) scale(1)'; 
            clone.style.transition = 'all 0.7s cubic-bezier(0.16, 1, 0.3, 1)'; 
            
            // 🔥 MANTÉM CORES LISAS NA ANIMAÇÃO NO MODO CLARO 🔥
            if(document.body.classList.contains('light-mode')) {
                clone.style.setProperty("background-color", "#ffffff", "important");
                if (elementoClicado.classList.contains('border-orange')) clone.style.setProperty("border-color", "rgba(255, 81, 0, 0.4)", "important");
                if (elementoClicado.classList.contains('border-yellow')) clone.style.setProperty("border-color", "rgba(255, 204, 0, 0.4)", "important");
                if (elementoClicado.classList.contains('border-purple')) clone.style.setProperty("border-color", "rgba(163, 0, 255, 0.4)", "important");
                if (elementoClicado.classList.contains('border-pink')) clone.style.setProperty("border-color", "rgba(255, 0, 128, 0.4)", "important");
                const lbl = clone.querySelector('.card-label');
                if(lbl) lbl.style.setProperty("color", "#1e222d", "important");
            }

            document.body.appendChild(clone); 
            
            if (overlayCinematico) overlayCinematico.classList.add('active'); 
            if (telaPrincipal) {
                telaPrincipal.style.transform = 'scale(0.92)'; 
                telaPrincipal.style.filter = 'blur(6px) brightness(0.3)'; 
            }
            
            const moveX = (window.innerWidth / 2) - (rect.left + rect.width / 2); 
            const moveY = (window.innerHeight / 2) - (rect.top + rect.height / 2); 
            
            requestAnimationFrame(() => { 
                clone.style.setProperty('transform', `translate(${moveX}px, ${moveY}px) scale(1.4)`, 'important');
                clone.style.setProperty('box-shadow', `0 30px 80px rgba(0, 0, 0, 0.9), 0 0 50px ${glowColor}`, 'important');
                if(!document.body.classList.contains('light-mode')) clone.style.setProperty('border-color', 'rgba(255, 255, 255, 0.3)', 'important');
            }); 
            
            // 🔥 REDIRECIONAMENTO CORRETO COM A VARIÁVEL DE TEMA 🔥
            setTimeout(() => { 
                let linkDestino = `avaliacao_publico.html?evento=${encodeURIComponent(nomeRealDaCampanha)}&id=${idEventoAtual}&sentimento=${encodeURIComponent(sentimentoEscolhido)}&gif=${encodeURIComponent(gifEscolhido)}&setor=${encodeURIComponent(setorAtual)}&proposta=${encodeURIComponent(propostaAtual)}`;
                if(document.body.classList.contains('light-mode')) linkDestino += "&theme=light";
                window.location.replace(linkDestino); 
            }, 1500);
        }
    </script>
