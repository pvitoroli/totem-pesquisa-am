<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Sentimento - AMP</title>
    
    <link rel="stylesheet" href="style-index.css">

    <style>
        body {
            background-color: #1b1e27;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================================================
           MODO CLARO - SOBRESCRITA ABSOLUTA (VENCENDO O CSS EXTERNO)
           ========================================================================== */
        body.light-mode { background-color: #f5f7f9 !important; color: #1e222d !important; }
        
        body.light-mode .totem-app-canvas {
            background-color: #ffffff !important;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.05) !important;
        }

        /* Textos Principais */
        body.light-mode h1, 
        body.light-mode h3, 
        body.light-mode h5, 
        body.light-mode p,
        body.light-mode span.card-label,
        body.light-mode #pergunta-principal-txt,
        body.light-mode #pergunta-principal-txt b {
            color: #1e222d !important;
        }

        /* Textos Secundários (Muted) */
        body.light-mode .campaign-mini-label,
        body.light-mode .brand-subtext,
        body.light-mode .status-text,
        body.light-mode .splash-slogan {
            color: #6b7280 !important;
        }

        body.light-mode .totem-header { border-bottom-color: rgba(0,0,0,0.1) !important; }
        body.light-mode .status-online-area { background-color: rgba(0,0,0,0.05) !important; }

        /* VOTE CARDS */
        body.light-mode .vote-card { background-color: #ffffff !important; border: 1.5px solid rgba(0,0,0,0.1) !important; }
        body.light-mode .vote-card:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important; transform: translateY(-5px) !important; }
        
        /* RESTAURANDO AS BORDAS COLORIDAS NO MODO CLARO */
        body.light-mode .vote-card.border-orange { border-color: rgba(255, 81, 0, 0.4) !important; }
        body.light-mode .vote-card.border-yellow { border-color: rgba(255, 204, 0, 0.4) !important; }
        body.light-mode .vote-card.border-purple { border-color: rgba(163, 0, 255, 0.4) !important; }
        body.light-mode .vote-card.border-pink { border-color: rgba(255, 0, 128, 0.4) !important; }

        /* Botões do Rodapé */
        body.light-mode .btn-action-footer {
            background-color: #ffffff !important;
            color: #6b7280 !important;
            border-color: rgba(0,0,0,0.1) !important;
        }
        body.light-mode .btn-action-footer:hover {
            background-color: rgba(255, 81, 0, 0.1) !important;
            color: #ff5100 !important;
            border-color: rgba(255, 81, 0, 0.3) !important;
        }

        /* Splash Screen & Overlay */
        body.light-mode #splash-screen,
        body.light-mode .loading-mask { background-color: #f5f7f9 !important; }
        body.light-mode #cinematic-overlay { background-color: rgba(255, 255, 255, 0.85) !important; }

        body:not(.light-mode) .splash-logo-img, 
        body:not(.light-mode) .brand-logo-img { filter: brightness(1.2) !important; }


        /* ==========================================================================
           ESTILOS DA SPLASH SCREEN (PADRÃO ESCURO)
           ========================================================================== */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1b1e27; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
            transition: opacity 0.5s ease, visibility 0.5s ease, background-color 0.3s ease;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; }

        .splash-content { text-align: center; display: flex; flex-direction: column; align-items: center; max-width: 400px; width: 100%; }

        .splash-logo-img { max-width: 130px; max-height: 35px; width: 100%; height: auto; object-fit: contain; margin-top: -40px; margin-bottom: 24px; transition: filter 0.3s ease; }

        .loading-bar-container { position: relative; width: 220px; height: auto; margin-top: 35px; overflow: hidden; }
        .loading-bar-img { width: 100%; height: auto; display: block; }
        .loading-mask { position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: #1b1e27; animation: revealRight 4.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; transition: background-color 0.3s ease; }
        @keyframes revealRight { 0% { left: 0%; } 100% { left: 100%; } }

        .splash-slogan { font-size: 11px; text-transform: uppercase; color: #a0a5b0; letter-spacing: 1.2px; font-weight: 600; margin-top: 25px; opacity: 0; animation: fadeInSlogan 1.5s ease forwards; animation-delay: 1.2s; }
        @keyframes fadeInSlogan { to { opacity: 1; } }

        .splash-glow { position: absolute; width: 160px; height: 160px; background: rgba(255, 81, 0, 0.12); border-radius: 50%; filter: blur(40px); z-index: -1; animation: pulseGlow 1.5s alternate infinite ease-in-out; }
        @keyframes pulseGlow { from { transform: scale(0.9); opacity: 0.5; } to { transform: scale(1.1); opacity: 1; } }

        /* ==========================================================================
           ANIMAÇÕES DOS BOTÕES E OVERLAY DE CINEMA
           ========================================================================== */
        .vote-card {
            background-color: #2a2f3a; 
            border: 1.5px solid rgba(255, 255, 255, 0.05); 
            border-radius: 20px; padding: 36px 12px; min-height: 200px; display: flex; 
            flex-direction: column; align-items: center; justify-content: space-evenly; text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .vote-card:active { transform: scale(0.95); }
        .vote-card:hover { box-shadow: 0 10px 25px rgba(255, 81, 0, 0.15); transform: translateY(-5px); }
        
        .card-label { font-size: 13px; font-weight: 700; color: white; text-align: center; display: block; padding-top: 4px; text-transform: uppercase; }

        .totem-app-canvas { transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.7s ease, opacity 0.7s ease; }

        #cinematic-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(6, 8, 12, 0.75); backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            opacity: 0; visibility: hidden; z-index: 99990;
            transition: opacity 0.6s ease, visibility 0.6s ease, backdrop-filter 0.6s ease, background-color 0.3s ease;
        }
        #cinematic-overlay.active { opacity: 1; visibility: visible; backdrop-filter: blur(10px); }

        .pulse-dot-verde { width: 6px; height: 6px; background-color: #4bb543; border-radius: 50%; display: inline-block; animation: pulseVerde 1.5s infinite; }
        @keyframes pulseVerde { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(75, 181, 67, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(75, 181, 67, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(75, 181, 67, 0); } }

        /* ==========================================================================
           RODAPÉ (AÇÕES)
           ========================================================================== */
        .footer-actions { margin-top: 65vh; margin-bottom: 40px; display: flex; justify-content: center; gap: 15px; width: 100%; }
        
        .btn-action-footer {
            background-color: rgba(255, 255, 255, 0.03); color: rgba(160, 165, 176, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 20px; border-radius: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
        }
        .btn-action-footer:hover { background-color: rgba(255, 81, 0, 0.1); color: #ff5100; border-color: rgba(255, 81, 0, 0.3); }
    </style>
</head>
<body>

    <script>
        const themeParams = new URLSearchParams(window.location.search);
        if (themeParams.has('theme')) localStorage.setItem('theme', themeParams.get('theme'));
        if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    </script>

    <div id="cinematic-overlay"></div>

    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-glow"></div>
            <img src="logo-arcelormittal.png" class="splash-logo-img" id="splashLogo" alt="Logo ArcelorMittal" onerror="this.style.display='none'">
            <span class="campaign-mini-label" style="font-size: 11px; text-transform: uppercase; color: #a0a5b0; letter-spacing: 2px; font-weight: 700; margin-bottom: 2px;">Você está na</span>
            <h1 style="font-size: 28px; font-weight: 800; color: white; margin: 5px 0 0 0; letter-spacing: 0.5px;">PESQUISA DE<br>SENTIMENTO</h1>
            <div class="loading-bar-container">
                <img src="simbolo-app.png" alt="Carregando..." class="loading-bar-img" onerror="this.style.display='none'">
                <div class="loading-mask"></div>
            </div>
            <div class="splash-slogan">A força da voz que molda o aço</div>
        </div>
    </div>

    <script>
        if(document.body.classList.contains('light-mode')) {
            document.getElementById('splashLogo').src = 'logo-arcelormittal-padrao.png';
        }
    </script>

    <div class="totem-app-canvas" id="main-interface" style="width: 100%; max-width: 600px;">
      <div class="totem-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; margin-bottom: 24px; height: 50px; transition: border-color 0.3s ease;">
        <div class="company-logo-area" style="display: flex; align-items: center; max-width: 140px; height: 100%;">
            <img src="logo-arcelormittal.png" alt="Logo ArcelorMittal" id="brandLogo" class="brand-logo-img" style="max-width: 130px; max-height: 35px; width: 100%; height: auto; object-fit: contain;" onerror="this.style.display='none'"/>
        </div>
        <div class="header-right-text" style="display: flex;">
            <span class="brand-subtext" style="font-size: 11px; color: #a0a5b0; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600;">PESQUISA DE SENTIMENTO - AMP</span>
        </div>
      </div>
      
      <script>
          if(document.body.classList.contains('light-mode')) {
              document.getElementById('brandLogo').src = 'logo-arcelormittal-padrao.png';
          }
      </script>
      
      <div class="title-section" style="text-align: center; margin-bottom: 28px; display: flex; flex-direction: column; align-items: center;">
        <span class="campaign-mini-label" style="font-size: 11px; text-transform: uppercase; color: #a0a5b0; letter-spacing: 2px; font-weight: 700; margin-bottom: 2px;">Campanha Ativa</span>
        
        <h3 id="nome-campanha-ativa" style="text-align: center; color: rgb(255, 81, 0); font-weight: bold; position: relative; margin-top: 5px; margin-bottom: 5px;">CARREGANDO...</h3>
        
        <h5 style="text-align: center; font-size: 15px; color: #a0a5b0; font-family: Helvetica; margin-top: 25px; margin-bottom: 15px;">
          <span id="pergunta-principal-txt" style="font-weight: normal; color: white;">O que você <b>SENTIU </b>no evento ou ação de hoje?</span>
        </h5>
        
        <div class="status-online-area" style="display: inline-flex; align-items: center; gap: 6px; background-color: rgba(255, 255, 255, 0.03); padding: 4px 10px; border-radius: 12px; transition: background-color 0.3s ease;">
            <span class="pulse-dot-verde"></span>
            <span class="status-text" style="font-size: 10px; color: #a0a5b0; font-weight: 600;">Conexão Totem Virtual</span>
        </div>
      </div>

      <div class="voting-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%;">
        
        <a href="javascript:void(0)" onclick="escolherSentimento(event, 1, this)" class="vote-card border-orange">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s1" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f632/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s1" class="card-label">APRENDI<br>ALGO NOVO</span>
        </a>

        <a href="javascript:void(0)" onclick="escolherSentimento(event, 2, this)" class="vote-card border-yellow">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s2" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f601/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s2" class="card-label">FIQUEI<br>FELIZ</span>
        </a>

        <a href="javascript:void(0)" onclick="escolherSentimento(event, 3, this)" class="vote-card border-purple">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s3" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f9d0/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s3" class="card-label">QUERO<br>SABER MAIS</span>
        </a>

        <a href="javascript:void(0)" onclick="escolherSentimento(event, 4, this)" class="vote-card border-pink">
          <div class="emoji-container" style="width: 80px; height: 80px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center;">
            <img id="gif-s4" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f614/512.gif" class="emoji-img" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <span id="label-s4" class="card-label">PODERIA<br>SER MELHOR</span>
        </a>
      </div>

      <div class="footer-actions">
          <button onclick="voltarParaAdmin()" class="btn-action-footer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>ENCERRAR</span>
          </button>
          
          <button onclick="alternarTemaTotem()" class="btn-action-footer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
              <span id="themeBtnText">MODO CLARO</span>
          </button>
      </div>

    </div>

    <script>
        // Define o texto inicial do botão baseado no estado
        if(document.body.classList.contains('light-mode')) {
            document.getElementById('themeBtnText').innerText = 'MODO ESCURO';
        }

        const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwuxwABRXCV3juwoRT1KXZ58gYVSxTueqMuu3Dn1Q9JA2ypyWQv0klh3yCpA3UakU7q/exec"; 
        const urlParams = new URLSearchParams(window.location.search); 
        let idEventoAtual = urlParams.get('evento'); 
        let setorAtual = urlParams.get('setor') || "Geral"; 
        let nomeRealDaCampanha = "Carregando..."; 

        let sentimentosAtivos = {
            1: { texto: "Aprendi algo novo", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f632/512.gif" },
            2: { texto: "Fiquei feliz", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f601/512.gif" },
            3: { texto: "Quero saber mais", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f9d0/512.gif" },
            4: { texto: "Poderia ser melhor", gif: "https://fonts.gstatic.com/s/e/notoemoji/latest/1f614/512.gif" }
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) { splash.classList.add('hidden'); setTimeout(() => splash.style.display = 'none', 500); }
            }, 4500);
        });

        function alternarTemaTotem() {
            document.body.classList.toggle('light-mode');
            const isLightNow = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLightNow ? 'light' : 'dark');
            
            const splashLogo = document.getElementById('splashLogo');
            const brandLogo = document.getElementById('brandLogo');
            if(splashLogo) splashLogo.src = isLightNow ? 'logo-arcelormittal-padrao.png' : 'logo-arcelormittal.png';
            if(brandLogo) brandLogo.src = isLightNow ? 'logo-arcelormittal-padrao.png' : 'logo-arcelormittal.png';

            document.getElementById('themeBtnText').innerText = isLightNow ? 'MODO ESCURO' : 'MODO CLARO';
        }

        function aplicarTemplateNaTela(t, nomeCampanha) {
            document.getElementById('nome-campanha-ativa').innerText = nomeCampanha;
            if (t.pergunta) document.getElementById('pergunta-principal-txt').innerHTML = t.pergunta.replace("SENTIU", "<b>SENTIU</b>");
            
            if (t.s1_texto) { sentimentosAtivos[1].texto = t.s1_texto; document.getElementById('label-s1').innerText = t.s1_texto; }
            if (t.s1_gif) { sentimentosAtivos[1].gif = t.s1_gif; document.getElementById('gif-s1').src = t.s1_gif; }
            if (t.s2_texto) { sentimentosAtivos[2].texto = t.s2_texto; document.getElementById('label-s2').innerText = t.s2_texto; }
            if (t.s2_gif) { sentimentosAtivos[2].gif = t.s2_gif; document.getElementById('gif-s2').src = t.s2_gif; }
            if (t.s3_texto) { sentimentosAtivos[3].texto = t.s3_texto; document.getElementById('label-s3').innerText = t.s3_texto; }
            if (t.s3_gif) { sentimentosAtivos[3].gif = t.s3_gif; document.getElementById('gif-s3').src = t.s3_gif; }
            if (t.s4_texto) { sentimentosAtivos[4].texto = t.s4_texto; document.getElementById('label-s4').innerText = t.s4_texto; }
            if (t.s4_gif) { sentimentosAtivos[4].gif = t.s4_gif; document.getElementById('gif-s4').src = t.s4_gif; }
        }

        async function buscarEventoAtivo() { 
            if (idEventoAtual) { 
                const cacheMemoria = localStorage.getItem('cache_evento_' + idEventoAtual);
                if (cacheMemoria) {
                    const dadosCacheados = JSON.parse(cacheMemoria);
                    nomeRealDaCampanha = dadosCacheados.nome; setorAtual = dadosCacheados.setor || setorAtual;
                    if (dadosCacheados.template) aplicarTemplateNaTela(dadosCacheados.template, nomeRealDaCampanha);
                }
                try { 
                    const res = await fetch(`${URL_BACKEND}?acao=buscarPorId&id=${idEventoAtual}&t=${Date.now()}`); 
                    const dados = await res.json(); 
                    if (dados.sucesso) { 
                        localStorage.setItem('cache_evento_' + idEventoAtual, JSON.stringify(dados));
                        nomeRealDaCampanha = dados.nome; setorAtual = dados.setor || setorAtual; 
                        if (dados.template) {
                            aplicarTemplateNaTela(dados.template, nomeRealDaCampanha);
                            if (dados.template.agradecimento) localStorage.setItem('agradecimento_' + idEventoAtual, dados.template.agradecimento);
                        }
                    } else { document.getElementById('nome-campanha-ativa').innerText = "Campanha Inativa"; } 
                } catch (e) { if (!cacheMemoria) document.getElementById('nome-campanha-ativa').innerText = "Erro de Conexão"; } 
            } else { document.getElementById('nome-campanha-ativa').innerText = "Pesquisa de Clima"; } 
        } 
        
        window.addEventListener('load', buscarEventoAtivo); 

        // O HERO TRANSITION
        function escolherSentimento(event, numeroSentimento, elementoClicado) { 
            event.preventDefault(); 
            if (window.animacaoEmAndamento) return; window.animacaoEmAndamento = true; 
            
            const objEscolhido = sentimentosAtivos[numeroSentimento] || { texto: "Geral", gif: "" };
            const telaPrincipal = document.getElementById('main-interface'); 
            const overlayCinematico = document.getElementById('cinematic-overlay'); 
            
            let glowColor = 'rgba(255, 81, 0, 0.6)'; 
            if (elementoClicado.classList.contains('border-yellow')) glowColor = 'rgba(255, 204, 0, 0.6)'; 
            if (elementoClicado.classList.contains('border-purple')) glowColor = 'rgba(163, 0, 255, 0.6)'; 
            if (elementoClicado.classList.contains('border-pink')) glowColor = 'rgba(255, 0, 128, 0.6)'; 
            
            const rect = elementoClicado.getBoundingClientRect(); const clone = elementoClicado.cloneNode(true); 
            elementoClicado.style.opacity = '0'; 
            
            clone.style.position = 'fixed'; clone.style.top = rect.top + 'px'; clone.style.left = rect.left + 'px'; clone.style.width = rect.width + 'px'; clone.style.height = rect.height + 'px'; clone.style.margin = '0'; clone.style.zIndex = '99995'; clone.style.transform = 'translate(0px, 0px) scale(1)'; clone.style.transition = 'all 0.7s cubic-bezier(0.16, 1, 0.3, 1)'; 
            
            // Garantir as bordas no clone se tiver no modo claro
            if(document.body.classList.contains('light-mode')) {
                clone.style.setProperty("background-color", "#ffffff", "important");
                if (elementoClicado.classList.contains('border-orange')) clone.style.setProperty("border-color", "rgba(255, 81, 0, 0.4)", "important");
                if (elementoClicado.classList.contains('border-yellow')) clone.style.setProperty("border-color", "rgba(255, 204, 0, 0.4)", "important");
                if (elementoClicado.classList.contains('border-purple')) clone.style.setProperty("border-color", "rgba(163, 0, 255, 0.4)", "important");
                if (elementoClicado.classList.contains('border-pink')) clone.style.setProperty("border-color", "rgba(255, 0, 128, 0.4)", "important");
            }

            document.body.appendChild(clone); 
            
            if (overlayCinematico) overlayCinematico.classList.add('active'); 
            if (telaPrincipal) { telaPrincipal.style.transform = 'scale(0.92)'; telaPrincipal.style.filter = 'blur(6px) brightness(0.3)'; }
            
            const moveX = (window.innerWidth / 2) - (rect.left + rect.width / 2); const moveY = (window.innerHeight / 2) - (rect.top + rect.height / 2); 
            
            requestAnimationFrame(() => { 
                clone.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.4)`; 
                clone.style.boxShadow = `0 30px 80px rgba(0, 0, 0, 0.9), 0 0 50px ${glowColor}`; 
                if(!document.body.classList.contains('light-mode')) clone.style.borderColor = 'rgba(255, 255, 255, 0.3)'; 
            }); 
            
            let linkProximaTela = `avaliacao.html?evento=${encodeURIComponent(nomeRealDaCampanha)}&id=${idEventoAtual}&sentimento=${encodeURIComponent(objEscolhido.texto)}&gif=${encodeURIComponent(objEscolhido.gif)}&setor=${encodeURIComponent(setorAtual)}`;
            if(document.body.classList.contains('light-mode')) linkProximaTela += "&theme=light";

            setTimeout(() => { window.location.href = linkProximaTela; }, 1500);
        }

        function voltarParaAdmin() {
            if (confirm("🔐 Acesso Restrito: Deseja encerrar a coleta e retornar ao Painel de Controle?")) { window.location.href = "admin.html"; }
        }
    </script>
</body>
