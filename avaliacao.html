<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação - Pesquisa de Sentimento</title>
    
    <link rel="stylesheet" href="style-avaliacao.css">

    <style>
        /* 🔥 GARANTE QUE O FUNDO SEJA INFINITO E UNIFORME 🔥 */
        html, body {
            background-color: #1b1e27;
            min-height: 100vh;
            margin: 0;
        }

        body {
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 🔥 REMOVE O "CAIXOTE" DO CSS EXTERNO DEIXANDO A TELA LIMPA 🔥 */
        .totem-app-canvas {
            background-color: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        
        /* STATUS ONLINE DISCRETO - Corrigido para Verde */
        .pulse-dot-verde {
            width: 6px !important;
            height: 6px !important;
            background-color: #4bb543 !important;
            border-radius: 50% !important;
            display: inline-block !important;
            animation: pulseVerde 1.5s infinite !important;
        }

        @keyframes pulseVerde {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(75, 181, 67, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(75, 181, 67, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(75, 181, 67, 0); }
        }

        /* ==========================================================================
           BOTÕES DE NOTA (0 a 10) - EFEITO HOVER E INTERAÇÃO
           ========================================================================== */
        .rating-btn {
            background-color: transparent; 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
        }

        .rating-btn:hover {
            border-color: #ff5100; 
            background-color: rgba(255, 81, 0, 0.1); 
            transform: scale(1.1); 
        }

        .rating-btn:active {
            background-color: #ff5100; 
            border-color: #ff5100;
            color: white;
            transform: scale(0.95); 
        }

        /* ==========================================================================
           NOVO DESIGN: SMART PROMPT (ESTILO CHAT/AI) E REVELAÇÃO PROGRESSIVA
           ========================================================================== */
        .comment-section {
            display: none; 
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .comment-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* A "Pílula" de texto */
        .smart-input-container {
            display: flex;
            align-items: flex-end;
            width: 100%;
            max-width: 450px;
            background-color: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 6px 6px 6px 18px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .smart-input-container:focus-within {
            border-color: #ff5100;
            background-color: rgba(255,255,255,0.05);
            box-shadow: 0 8px 30px rgba(255, 81, 0, 0.15);
        }

        #campo-comentario {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            padding: 10px 0;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.4;
            transition: height 0.2s ease;
        }

        #campo-comentario::placeholder {
            color: #7b8190;
        }

        /* O Botão de Seta Embutido */
        .btn-smart-send {
            background-color: rgba(255,255,255,0.1);
            color: #a0a5b0;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-left: 10px;
            flex-shrink: 0;
        }

        .btn-smart-send.active {
            background-color: #ff5100;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 81, 0, 0.4);
        }

        .btn-smart-send svg {
            transition: transform 0.3s ease;
        }
        
        .btn-smart-send.active:hover svg {
            transform: translateY(-2px) translateX(2px);
        }

        /* Botão de Pular Minimalista */
        .btn-skip-text {
            background: transparent;
            border: none;
            color: #a0a5b0;
            font-size: 13px;
            font-weight: 600;
            margin-top: 16px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 450px;
        }

        .btn-skip-text:hover {
            color: white;
            transform: translateY(-2px);
        }

        /* ==========================================================================
           BOTÃO VOLTAR CENTRALIZADO E VAZADO
           ========================================================================== */
        .action-footer {
            margin-top: auto; 
            padding-top: 30px;
            display: flex; 
            justify-content: center;
            width: 100%;
        }

        .btn-back {
            color: #a0a5b0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 24px;
            background-color: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-back:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ==========================================================================
           MODO CLARO: BLINDAGEM DA TELA DE AVALIAÇÃO
           ========================================================================== */
        body.light-mode { background-color: #f5f7f9 !important; }
        body.light-mode .totem-app-canvas { background-color: transparent !important; box-shadow: none !important; }
        body.light-mode h5 span, body.light-mode #label-sentimento-escolhido { color: #1e222d !important; }
        body.light-mode h5, body.light-mode .brand-subtext, body.light-mode .campaign-mini-label, body.light-mode .status-text, body.light-mode .preview-text-label { color: #6b7280 !important; }
        body.light-mode .totem-header { border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important; }
        body.light-mode .status-online-area { background-color: rgba(0, 0, 0, 0.05) !important; }
        
        body.light-mode .rating-btn { background-color: #ffffff !important; border: 2px solid rgba(0, 0, 0, 0.08) !important; color: #1e222d !important; box-shadow: 0 4px 10px rgba(0,0,0,0.03) !important; }
        body.light-mode .rating-btn:hover { border-color: rgba(255, 81, 0, 0.6) !important; background-color: rgba(255, 81, 0, 0.1) !important; color: #ff5100 !important; }
        body.light-mode .rating-btn:active { background-color: #ff5100 !important; border-color: #ff5100 !important; color: #ffffff !important; }
        body.light-mode .brand-logo-img { filter: none !important; }

        /* Adaptação do Smart Prompt para o Modo Claro */
        body.light-mode .smart-input-container { background-color: #ffffff !important; border-color: rgba(0,0,0,0.1) !important; }
        body.light-mode .smart-input-container:focus-within { border-color: #ff5100 !important; }
        body.light-mode #campo-comentario { color: #1e222d !important; }
        body.light-mode .btn-smart-send:not(.active) { background-color: #f0f2f5; color: #9ca3af; }

        /* Botão Pular e Voltar no Modo Claro */
        body.light-mode .btn-skip-text { background: transparent; border: none; color: #6b7280; }
        body.light-mode .btn-skip-text:hover { color: #1e222d; }
        
        body.light-mode .btn-back { background-color: transparent !important; color: #6b7280 !important; border: 1px solid rgba(0, 0, 0, 0.2) !important; }
        body.light-mode .btn-back:hover { background-color: rgba(0, 0, 0, 0.04) !important; color: #1e222d !important; border-color: rgba(0, 0, 0, 0.4) !important; }
    </style>
</head>
<body>

    <script>
        const themeParams = new URLSearchParams(window.location.search);
        if (themeParams.has('theme')) localStorage.setItem('theme', themeParams.get('theme'));
        if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    </script>

    <div class="totem-app-canvas" style="width: 100%; max-width: 600px; display: flex; flex-direction: column; min-height: 90vh;">
      <div class="totem-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; margin-bottom: 24px; height: 50px;">
       <div class="company-logo-area" style="display: flex; align-items: center; max-width: 140px; height: 100%;">
            <img src="logo-arcelormittal.png" alt="Logo ArcelorMittal" class="brand-logo-img" style="filter: brightness(1.2); max-width: 130px; max-height: 35px; width: 100%; height: auto; object-fit: contain;" />
        </div>
        <div class="header-right-text" style="display: flex;">
            <span class="brand-subtext" style="font-size: 11px; color: rgb(160, 165, 176); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600;">PESQUISA DE SENTIMENTO - AMP</span>
        </div>
      </div>
      
      <div class="title-section" style="text-align: center; margin-bottom: 28px; display: flex; flex-direction: column; align-items: center;">
        <span class="campaign-mini-label" style="font-size: 11px; text-transform: uppercase; color: rgb(160, 165, 176); letter-spacing: 2px; font-weight: 700; margin-bottom: 2px;">Campanha Ativa</span>
        
        <h3 id="sub-evento-nome" style="text-align: center; color: rgb(255, 81, 0); font-weight: bold; position: relative; margin-top: 5px; margin-bottom: 5px;">CARREGANDO...</h3>
        
        <h5 style="text-align: center; font-size: 15px; color: #a0a5b0; font-family: Helvetica; margin-top: 25px; margin-bottom: 15px;">
          <span style="font-weight: normal; color: white;">Deixe aqui sua <b>NOTA GERAL</b> para a campanha!</span>
        </h5>
        
        <div class="status-online-area" style="display: inline-flex; align-items: center; gap: 6px; background-color: rgba(255, 255, 255, 0.03); padding: 4px 10px; border-radius: 12px;">
            <span class="pulse-dot-verde"></span>
            <span class="status-text" style="font-size: 10px; color: rgb(160, 165, 176); font-weight: 600;">Conexão Totem Virtual</span>
        </div>
      </div>
      
      <div class="selected-sentiment-preview">
          <img id="emoji-preview" src="" alt="Emoji" class="emoji-preview-img" style="display: none;">
          <span id="label-sentimento-escolhido" class="preview-text-label">Carregando voto...</span>
      </div>
      
      <div class="rating-container" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px;">
        <div class="rating-row" style="display: flex; justify-content: center; gap: 8px;">
            <button onclick="enviarDados(0)" class="rating-btn">0</button>
            <button onclick="enviarDados(1)" class="rating-btn">1</button>
            <button onclick="enviarDados(2)" class="rating-btn">2</button>
            <button onclick="enviarDados(3)" class="rating-btn">3</button>
            <button onclick="enviarDados(4)" class="rating-btn">4</button>
            <button onclick="enviarDados(5)" class="rating-btn">5</button>
        </div>
        <div class="rating-row" style="display: flex; justify-content: center; gap: 8px;">
            <button onclick="enviarDados(6)" class="rating-btn">6</button>
            <button onclick="enviarDados(7)" class="rating-btn">7</button>
            <button onclick="enviarDados(8)" class="rating-btn">8</button>
            <button onclick="enviarDados(9)" class="rating-btn">9</button>
            <button onclick="enviarDados(10)" class="rating-btn">10</button>
        </div>
      </div>

      <!-- NOVA ÁREA DE COMENTÁRIO: SMART PROMPT (Inicia oculta) -->
      <div class="comment-section">
          <div class="smart-input-container">
              <!-- Textarea que estica (com onblur para murchar se vazio) -->
              <textarea id="campo-comentario" rows="1" placeholder="Quer detalhar o motivo? (Opcional)" oninput="autoExpand(this)" onblur="shrinkSeVazio(this)"></textarea>
              
              <!-- Botão Icone Embutido -->
              <button class="btn-smart-send" id="btn-enviar-icon" onclick="confirmarEnvio()" title="Enviar Avaliação">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"></line>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
              </button>
          </div>

          <!-- Rota de Fricção Zero -->
          <button class="btn-skip-text" onclick="confirmarEnvio()">
              Pular e registrar apenas a nota 
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
      </div>
      
      <div class="action-footer">
          <span id="link-voltar-dinamico"></span>
      </div>
    </div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const evento = urlParams.get('evento') || "";
    const id = urlParams.get('id') || "";

    // 🔥 O FILTRO NORMALIZADOR DE CAPS LOCK 🔥
    // Transforma "APRENDI ALGO NOVO" em "Aprendi algo novo"
    function padronizarTexto(texto) {
        if (!texto || texto === "Geral") return "Geral";
        texto = texto.toLowerCase(); // Tudo minúsculo
        return texto.charAt(0).toUpperCase() + texto.slice(1); // Só a primeira fica maiúscula
    }
    const sentimento = padronizarTexto(urlParams.get('sentimento'));

    const setor = urlParams.get('setor') || "Geral";
    const gif = urlParams.get('gif') || ""; 
    const proposta = urlParams.get('proposta') || "Geral";

    const linksEmojis = {
        "Aprendi algo novo": "https://fonts.gstatic.com/s/e/notoemoji/latest/1f632/512.gif",
        "Fiquei feliz": "https://fonts.gstatic.com/s/e/notoemoji/latest/1f601/512.gif",
        "Quero saber mais": "https://fonts.gstatic.com/s/e/notoemoji/latest/1f9d0/512.gif",
        "Poderia ser melhor": "https://fonts.gstatic.com/s/e/notoemoji/latest/1f614/512.gif"
    };

    document.getElementById('sub-evento-nome').innerText = evento;
    
    // Mostra o sentimento na tela convertido no formato amigável
    document.getElementById('label-sentimento-escolhido').innerText = sentimento;

    const imgEmoji = document.getElementById('emoji-preview');
    // Agora o GIF não quebra, pois o texto padronizado casa perfeitamente com a lista "linksEmojis"
    const urlGifFinal = gif || linksEmojis[sentimento];
    
    if (urlGifFinal) {
        imgEmoji.src = urlGifFinal;
        imgEmoji.style.display = 'block'; 
    }

    if(document.body.classList.contains('light-mode')) {
        const logo = document.querySelector('.brand-logo-img');
        if(logo) logo.src = 'logo-arcelormittal-padrao.png';
    }

    // Configura o link de voltar vazado
    let linkVoltar = `index.html?evento=${id}&setor=${encodeURIComponent(setor)}`;
    if(document.body.classList.contains('light-mode')) linkVoltar += "&theme=light";
    document.getElementById('link-voltar-dinamico').innerHTML = `<a href="${linkVoltar}" class="btn-back">← Voltar</a>`;

    // Variável global para guardar a nota escolhida
    let notaSelecionada = null;

    // 🔥 AUTO-EXPANSÃO DA CAIXA E ANIMAÇÃO DO BOTÃO 🔥
    function autoExpand(field) {
        field.style.height = 'inherit';
        const computed = window.getComputedStyle(field);
        const height = parseInt(computed.getPropertyValue('border-top-width'), 10)
                     + parseInt(computed.getPropertyValue('padding-top'), 10)
                     + field.scrollHeight
                     + parseInt(computed.getPropertyValue('padding-bottom'), 10)
                     + parseInt(computed.getPropertyValue('border-bottom-width'), 10);
        
        field.style.height = height + 'px';

        const btnSend = document.getElementById('btn-enviar-icon');
        if (field.value.trim().length > 0) {
            btnSend.classList.add('active');
        } else {
            btnSend.classList.remove('active');
        }
    }

    // 🔥 EFEITO "MURCHAR" SE CLICAR FORA E ESTIVER VAZIO 🔥
    function shrinkSeVazio(field) {
        if (field.value.trim() === '') {
            field.value = ''; // Remove espaços em branco perdidos
            field.style.removeProperty('height'); // Murcha de volta pro row="1"
            document.getElementById('btn-enviar-icon').classList.remove('active');
        }
    }

    // 🔥 FUNÇÃO DE SELEÇÃO DE NOTA E REVELAÇÃO DA CAIXA 🔥
    function enviarDados(nota) {
        notaSelecionada = nota;
        
        document.querySelectorAll('.rating-btn').forEach(b => {
            b.style.removeProperty("background-color");
            b.style.removeProperty("border-color");
            b.style.removeProperty("color");
        });
        
        event.target.style.setProperty("background-color", "#ff5100", "important");
        event.target.style.setProperty("border-color", "#ff5100", "important");
        event.target.style.setProperty("color", "#ffffff", "important");

        const commentArea = document.querySelector('.comment-section');
        if (commentArea.style.display !== 'flex') {
            commentArea.style.display = 'flex';
            setTimeout(() => {
                commentArea.classList.add('show');
            }, 50);
        }
    }

    // 🔥 FUNÇÃO DE CONFIRMAÇÃO COM REDIRECIONAMENTO IMEDIATO 🔥
    function confirmarEnvio() {
        if (notaSelecionada === null) {
            alert("Por favor, selecione uma nota de 0 a 10 antes de prosseguir!");
            return;
        }

        const campoTexto = document.getElementById('campo-comentario');
        const comentarioTexto = campoTexto.value.trim();

        // Trava os botões visualmente para evitar clique duplo
        const btnIcon = document.getElementById('btn-enviar-icon');
        btnIcon.style.pointerEvents = "none";
        btnIcon.style.opacity = "0.5";

        let urlDestino = `agradecimento.html?id=${id}&setor=${encodeURIComponent(setor)}&evento=${encodeURIComponent(evento)}&sentimento=${encodeURIComponent(sentimento)}&nota=${notaSelecionada}&proposta=${encodeURIComponent(proposta)}&comentario=${encodeURIComponent(comentarioTexto)}`;
        
        if(document.body.classList.contains('light-mode')) urlDestino += "&theme=light";
        
        window.location.href = urlDestino;
    }
    </script>
</body>
</html>
