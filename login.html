<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pesquisa de Sentimento</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f1115; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        /* Efeito de brilho de fundo */
        .glow { position: absolute; width: 400px; height: 400px; background: rgba(255, 81, 0, 0.12); border-radius: 50%; filter: blur(90px); z-index: 0; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        .login-box { background: #1e222d; padding: 45px 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); width: 90%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); z-index: 10; position: relative; }
        
        /* Identidade Centralizada */
        .header-identidade { text-align: center; margin-bottom: 30px; }
        .logo-empresa { width: 130px; margin: 0 auto 25px auto; display: block; filter: brightness(1.2); }
        
        /* 🔥 Bloco da Marca do App - Ajustado para empilhar verticalmente 🔥 */
        .brand-app-complete { 
            display: flex; 
            flex-direction: column; /* Empilha os itens verticalmente */
            align-items: center;    /* Centraliza os itens horizontalmente na coluna */
            justify-content: center; 
            gap: 10px;               /* Espaçamento entre o título e o símbolo colorido */
            margin-bottom: 20px; 
        }
        
        /* Símbolo do App agora posicionado embaixo */
        .simbolo-app-img { 
            width: 46px; 
            height: 46px; 
            object-fit: contain; 
            display: block;
        }
        
        /* Título Principal - Agora centralizado */
        .system-name { 
            font-size: 20px; 
            font-weight: 800; 
            color: white; 
            letter-spacing: 0.5px; 
            text-align: center;      /* Texto centralizado */
            line-height: 1.15; 
        }
        
        /* Subtítulo independente bem separado */
        .mini-label { font-size: 11px; text-transform: uppercase; color: #9aa0a6; letter-spacing: 1.5px; font-weight: 700; display: block; margin-top: 15px; }

        /* Formulário */
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #9aa0a6; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; margin-left: 4px; }
        
        input, select { width: 100%; padding: 14px 16px; background: #0f1115; border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: #ff5100; box-shadow: 0 0 0 3px rgba(255, 81, 0, 0.1); }
        
        /* Seta Customizada do Select */
        select { 
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa0a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 45px;
            cursor: pointer;
        }

        /* Container da Senha com Olhinho */
        .password-container { position: relative; display: flex; align-items: center; }
        .password-container input { padding-right: 45px; }
        .toggle-password { position: absolute; right: 16px; cursor: pointer; color: #9aa0a6; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .toggle-password:hover { color: white; }
        
        /* Botão */
        .btn-login { width: 100%; padding: 16px; background: #ff5100; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 81, 0, 0.2); }
        .btn-login:hover { background: #e04700; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 81, 0, 0.4); }
        .btn-login:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; color: #aaa; }
        
        #msgErro { background: rgba(255, 0, 110, 0.1); border: 1px solid rgba(255, 0, 110, 0.3); color: #ff006e; font-size: 12px; padding: 12px; border-radius: 8px; text-align: center; margin-top: 20px; display: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="glow"></div>
    
    <div class="login-box">
        
        <div class="header-identidade">
            <img src="logo-arcelormittal.png" alt="ArcelorMittal" class="logo-empresa" onerror="this.style.display='none'">
            
            <div class="brand-app-complete">
                <h1 class="system-name">PESQUISA DE<br>SENTIMENTO</h1>
                <img src="simbolo-app.png" alt="Símbolo" class="simbolo-app-img" onerror="this.style.display='none'">
            </div>

            <span class="mini-label">Acessar Painel de Gestão</span>
        </div>
        
        <div class="input-group">
            <label>Setor Administrativo</label>
            <select id="setorSelect">
                <option value="" disabled selected>Selecione o seu setor...</option>
            </select>
        </div>

        <div class="input-group">
            <label>Palavra-Passe</label>
            <div class="password-container">
                <input type="password" id="senhaInput" placeholder="Insira a sua senha">
                <span class="toggle-password" id="togglePasswordIcon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
        </div>

        <button class="btn-login" id="btnEntrar" onclick="fazerLogin()">Autenticar Sessão</button>
        <div id="msgErro">Credencial inválida!</div>
    </div>

    <script>
        const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwuxwABRXCV3juwoRT1KXZ58gYVSxTueqMuu3Dn1Q9JA2ypyWQv0klh3yCpA3UakU7q/exec"; 

        // 1. CARREGAMENTO DOS SETORES
        window.onload = async () => {
            if (localStorage.getItem('setorLogado')) {
                window.location.href = "admin.html";
                return;
            }

            try {
                const res = await fetch(`${URL_BACKEND}?acao=listarSetores`);
                const setores = await res.json();
                const select = document.getElementById('setorSelect');
                
                select.innerHTML = '<option value="" disabled selected>Selecione o seu setor...</option>'; 
                setores.forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
                select.innerHTML += `<option value="Master">Master</option>`;
                
            } catch(e) {
                document.getElementById('setorSelect').innerHTML = '<option value="" disabled selected>Erro ao carregar</option><option value="Master">Master</option>';
            }
        };

        // 2. FUNÇÃO DE REVELAR SENHA (OLHINHO)
        document.getElementById('togglePasswordIcon').addEventListener('click', function () {
            const senhaInput = document.getElementById('senhaInput');
            const tipo = senhaInput.getAttribute('type') === 'password' ? 'text' : 'password';
            senhaInput.setAttribute('type', tipo);
            
            // Troca o ícone de Olho Aberto para Olho Fechado
            if (tipo === 'text') {
                this.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>`;
            } else {
                this.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>`;
            }
        });

        // 3. FUNÇÃO DE LOGIN
        async function fazerLogin() {
            const setor = document.getElementById('setorSelect').value;
            const senha = document.getElementById('senhaInput').value;
            const btn = document.getElementById('btnEntrar');
            const erro = document.getElementById('msgErro');
            
            if(!setor || !senha) {
                erro.innerText = "Preencha todos os campos."; 
                erro.style.display = "block"; 
                return;
            }
            
            btn.innerText = "A verificar credenciais..."; 
            btn.disabled = true; 
            erro.style.display = "none";
            
            try {
                const res = await fetch(`${URL_BACKEND}?acao=login&setor=${encodeURIComponent(setor)}&senha=${encodeURIComponent(senha)}`);
                const dados = await res.json();
                
                if(dados.sucesso) {
                    localStorage.setItem('setorLogado', dados.setor);
                    window.location.href = "admin.html";
                } else {
                    erro.innerText = dados.erro; 
                    erro.style.display = "block";
                }
            } catch(e) {
                erro.innerText = "Erro de conexão com o servidor. Tente novamente."; 
                erro.style.display = "block";
            }
            
            btn.innerText = "Autenticar Sessão"; 
            btn.disabled = false;
        }
    </script>
</body>
</html>
